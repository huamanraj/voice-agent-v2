[project]
name = "voice-agent"
version = "0.1.0"
description = "Production-ready telephony AI voice agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.1",
    "litellm>=1.73.0",
    "numpy>=2.3.0",
    "onnxruntime>=1.23.0",
    "pydantic-settings>=2.14.1",
    "transformers>=4.57.0",
    "uvicorn>=0.47.0",
    "websockets>=16.0",
]

[project.scripts]
voice-agent = "voice_agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep temp dirs inside the repo; avoids PermissionError on E:\temp\pytest-of-*.
addopts = ["-p", "no:cacheprovider", "--basetemp=.pytest-tmp"]
