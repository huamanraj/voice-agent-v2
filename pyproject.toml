[project]
name = "voice-agent"
version = "0.1.0"
description = "Production-ready telephony AI voice agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.1",
    "pydantic-settings>=2.14.1",
    "uvicorn>=0.47.0",
]

[project.scripts]
voice-agent = "voice_agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
